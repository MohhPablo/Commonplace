<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commonplace layout verification</title><style>body{margin:0;padding:20px;background:#ddd;font:14px system-ui;color:#222}header{display:flex;gap:12px;align-items:center;margin-bottom:16px}label{display:flex;gap:8px;align-items:center}select{padding:8px}iframe{display:block;border:0;background:#f2f2f7;box-shadow:0 0 0 1px #999}p{max-width:600px;color:#555}</style></head><body><header><strong>Commonplace · layout verification</strong><label>Viewport<select id="size"><option value="375,812">375 × 812</option><option value="390,844">390 × 844</option><option value="414,896">414 × 896</option><option value="430,932">430 × 932</option><option value="844,390">844 × 390</option></select></label></header><iframe title="Commonplace mobile preview" src="/" width="375" height="812"></iframe><p>Real app in a constrained CSS viewport. This checks layout, not physical iPhone keyboard or safe-area behavior. Temporary preview page; excluded from the final main branch.</p><script>document.querySelector('#size').onchange=e=>{const [w,h]=e.target.value.split(',');const frame=document.querySelector('iframe');frame.width=w;frame.height=h}</script></body></html>
