    <title>Commonplace</title>

    <script>
      // Paint the saved theme before the first frame so the boot splash never flashes.
      (function () {
        var theme = "system";
        try {
          theme = localStorage.getItem("commonplace:theme") || "system";
        } catch (e) {}
        if (theme === "system")
          theme = matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "paper";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <!-- Mirrors the launch images: same icon, wordmark and positions. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f3f1ee;
      }
      /* iOS 26 shortens a Home Screen app's viewport by the status bar
         whenever the page is no taller than the screen (WebKit bug 301108),
         leaving a dead strip under the tab bar. A page that reaches the full
         screen gets the full viewport. min() keeps opaque status bars from
         scrolling. */
      @media (display-mode: standalone) {
        html {
          min-height: min(100lvh, calc(100% + env(safe-area-inset-top)));
        }
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body {
        background: #000;
      }
      html[data-theme="sepia"],
      html[data-theme="sepia"] body {
        background: #f1e9db;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #f3f1ee;
        color: #1d1d1f;
        font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        transition: opacity 260ms ease;
      }
      html[data-theme="dark"] #boot-splash {
        background: #000;
        color: #f5f5f7;
      }
      html[data-theme="sepia"] #boot-splash {
        background: #f1e9db;
        color: #3c332b;
      }
      #boot-splash img {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 104px;
        height: 104px;
        margin: -76px 0 0 -52px;
        border-radius: 23.5px;
      }
      #boot-splash p {
        position: absolute;
        inset-inline: 0;
        top: 50%;
        margin: 48px 0 0;
        text-align: center;
        font-size: 22px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      #boot-splash span {
        color: #e5582f;
      }
      #boot-splash.boot-splash--hide {
        opacity: 0;
      }
    </style>

  <body>
    <div id="root"></div>
    <div id="boot-splash" aria-hidden="true">
      <img src="/icons/icon.svg" alt="" />
      <p>Commonplace<span>.</span></p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
