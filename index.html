<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS ignores the manifest for these — must be separate (see pwa-ios-technical-reference §1a) -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Commonplace" />
    <meta name="theme-color" content="#F2F2F7" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />

    <title>Commonplace</title>

    <!-- Cheap splash: paint paper bg + wordmark instantly, before JS loads (see §2 option 2) -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f2f2f7;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f2f2f7;
        z-index: 9999;
        font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        font-weight: 600;
        font-size: 28px;
        letter-spacing: 0.01em;
        color: #2b2420;
        opacity: 1;
        transition: opacity 400ms ease;
      }
      #boot-splash.boot-splash--hide {
        opacity: 0;
      }
      #boot-splash .dot {
        color: #c1502d;
      }
      #root:not(:empty) + #boot-splash {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash">Commonplace<span class="dot">.</span></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
